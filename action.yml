name: 'Vitalik Action'
description: 'The updater'

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Update lock
      shell: bash
      run: |
        rm .kotlin-locks/js/package-lock.json
        rm .kotlin-locks/wasmjs/package-lock.json
        ./gradlew :kotlinStorePackageLock :kotlinWasmStorePackageLock

    - id: modified-files
      name: Check modified files
      shell: bash
      run: |
        if git diff --quiet HEAD -- .kotlin-locks/js/package-lock.json &&
           git diff --quiet HEAD -- .kotlin-locks/wasmjs/package-lock.json; then
          echo "modified=false" >> $GITHUB_OUTPUT
        else
          echo "modified=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit changes
      if: steps.modified-files.outputs.modified == 'true'
      shell: bash
      run: |
        git add .kotlin-locks/js/package-lock.json
        git add .kotlin-locks/wasmjs/package-lock.json
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
        git commit -m "Update \`package-lock.json\` files"

    - name: Push changes
      if: steps.modified-files.outputs.modified == 'true'
      shell: bash
      run: |
        git push https://${{ github.token }}@github.com/${{ github.repository }}.git

branding:
  icon: 'lock'
  color: 'orange'
